spring.application.name=EngiSpace

# Initial administrator credentials. Change these before deployment.
engispace.admin.username=${ENGISPACE_ADMIN_USERNAME:admin}
engispace.admin.password=${ENGISPACE_ADMIN_PASSWORD:ChangeMe123!}
engispace.users-file=${ENGISPACE_USERS_FILE:src/main/resources/data/users.json}
server.port=${PORT:8080}

# Early-out cleanliness photo upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

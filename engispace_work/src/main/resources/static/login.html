<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | EngiSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand-icon">E</div>
        <h1>EngiSpace</h1>
        <p class="login-subtitle">CLASSROOM MANAGEMENT SYSTEM</p>
        <h2>Welcome Back!</h2>
        <p class="login-description">Sign in using your authorized account.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <p id="loginError" class="login-error" role="alert"></p>
            <button class="primary-btn login-submit" id="loginButton" type="submit">Sign In</button>
        </form>
        <p class="login-footnote">Accounts are provided by the EngiSpace administrator.</p>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
